<?xml version="1.0" encoding="UTF-8"?>
<!--
  Otuburu app icon — glowing yellow "O" on near-black background.

  Design rationale:
    - 1024×1024 source; @capacitor/assets generates all density variants
      from this.
    - Brand mark stays inside the central ~66% safe area so Android's
      adaptive icon mask (circular / squircle / teardrop, varies by
      launcher) doesn't crop. 360px-radius safe circle.
    - Brand yellow #f5b800 with a top highlight #fde047 fading to a
      bottom shadow #d49600 — gives the ring a subtle emissive feel
      without going skeumorphic.
    - A soft radial halo behind the O reads as 'glow' at small home-
      screen sizes (Android renders down to 48dp ≈ 144px in launcher).
    - One discreet upward tick mark above the O — trading-app cue,
      doesn't crowd the letterform.
    - No wordmark — at icon scale (~48dp on a real phone), six glyphs
      become illegible mush. The "O" alone reads.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Soft yellow radial glow behind the O. Opacity falls off so the
         halo doesn't terminate in a hard ring at any zoom. -->
    <radialGradient id="haloGrad" cx="512" cy="512" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#fde047" stop-opacity="0.45"/>
      <stop offset="45%"  stop-color="#f5b800" stop-opacity="0.20"/>
      <stop offset="80%"  stop-color="#f5b800" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0"/>
    </radialGradient>

    <!-- Top-light / bottom-warm gradient on the O ring itself.
         Gives the letterform a subtle 3D feel without being heavy. -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#fde047"/>
      <stop offset="50%"  stop-color="#f5b800"/>
      <stop offset="100%" stop-color="#d49600"/>
    </linearGradient>

    <!-- Outer glow blur around the O. stdDeviation tuned so glow reads
         at icon scale but doesn't smear into the halo. -->
    <filter id="oGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base surface — dark, matches app shell.
       Square fill (not rounded) — Android's adaptive icon mask handles
       the corner radius at the launcher level. -->
  <rect width="1024" height="1024" fill="#0d0d0d"/>

  <!-- Yellow halo behind the mark -->
  <circle cx="512" cy="512" r="450" fill="url(#haloGrad)"/>

  <!-- The O — thick ring, glowing -->
  <g filter="url(#oGlow)">
    <circle cx="512" cy="512" r="240" fill="none" stroke="url(#ringGrad)" stroke-width="80"/>
  </g>

  <!-- Tiny upward arrow above the O — trading angle without crowding -->
  <g opacity="0.85">
    <path d="M 480 195 L 512 155 L 544 195 L 524 195 L 524 260 L 500 260 L 500 195 Z"
          fill="#f5b800"/>
  </g>
</svg>
