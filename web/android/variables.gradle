ext {
    minSdkVersion = 23
    // Bumped to 36 because Capacitor 8 transitively pulls androidx.browser:1.9.0
    // which requires API 36. targetSdk follows compileSdk so we opt into the
    // Android 16 runtime behaviour as well — Android 15 (API 35) and Android 16
    // (API 36) are both supported here.
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
}