apply plugin: 'com.android.application'

android {
    namespace "money.torama.otuburu"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "money.torama.otuburu"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Release signing reads from gradle properties (set in
    // ~/.gradle/gradle.properties — NEVER committed) or env vars, in that
    // order. If neither is set, signingConfigs.release stays empty and
    // assembleRelease still completes — it just produces the unsigned
    // variant. That keeps the build green on machines without keystore
    // access (CI smoke tests, fresh clones) while letting release builders
    // produce a signed APK with no extra ceremony.
    signingConfigs {
        release {
            def kFile  = project.findProperty('OTUBURU_RELEASE_KEYSTORE')      ?: System.getenv('OTUBURU_RELEASE_KEYSTORE')
            def kPwd   = project.findProperty('OTUBURU_RELEASE_STORE_PASSWORD') ?: System.getenv('OTUBURU_RELEASE_STORE_PASSWORD')
            def kAlias = project.findProperty('OTUBURU_RELEASE_KEY_ALIAS')      ?: System.getenv('OTUBURU_RELEASE_KEY_ALIAS')
            def kKeyPw = project.findProperty('OTUBURU_RELEASE_KEY_PASSWORD')   ?: System.getenv('OTUBURU_RELEASE_KEY_PASSWORD')
            if (kFile && kPwd && kAlias && kKeyPw) {
                storeFile     file(kFile)
                storePassword kPwd
                keyAlias      kAlias
                keyPassword   kKeyPw
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Attach the signing config only when it was populated above.
            // Without this check, AGP errors out on missing storeFile when
            // a contributor without the keystore tries to ./gradlew
            // assembleRelease.
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// Force the legacy kotlin-stdlib-jdk7/jdk8 modules up to 1.8.22 so they
// match the kotlin-stdlib pulled in by the modern dependencies. Since
// Kotlin 1.8, the jdk7/jdk8 extensions live INSIDE kotlin-stdlib itself —
// the standalone jdk7/jdk8 artifacts at 1.8.0+ are empty compatibility
// shims. Without this forced resolution, Capacitor's cordova-android-plugins
// shim brings in jdk7/jdk8 at 1.6.21 (which still has real classes), and
// :app:checkReleaseDuplicateClasses fails on every kotlin.* class that
// also lives in stdlib 1.8.22.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin'
                && (details.requested.name == 'kotlin-stdlib-jdk7'
                    || details.requested.name == 'kotlin-stdlib-jdk8')) {
            details.useVersion '1.8.22'
            details.because 'Avoid duplicate classes with kotlin-stdlib 1.8+'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
