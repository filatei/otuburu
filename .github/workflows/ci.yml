name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Rust engine ─────────────────────────────────────────────
  rust:
    name: Rust engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-engine

    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-engine/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all

  # ── Go services ─────────────────────────────────────────────
  go:
    name: Go services
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-services

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: "go-services/**/go.sum"

      - name: Vet
        run: |
          for mod in account gateway risk-monitor; do
            echo "--- go vet $mod ---"
            (cd $mod && go vet ./...)
          done

      - name: Test
        run: |
          for mod in account gateway risk-monitor; do
            echo "--- go test $mod ---"
            (cd $mod && go test ./... -race -timeout 60s)
          done

  # ── Node demo ───────────────────────────────────────────────
  node-demo:
    name: Node demo lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Syntax check
        run: node --check engine/server.js engine/engine.js engine/generators.js engine/rng.js

  # ── Terraform validate ──────────────────────────────────────
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Init (staging)
        run: terraform -chdir=envs/staging init -backend=false

      - name: Validate (staging)
        run: terraform -chdir=envs/staging validate

      - name: Init (production)
        run: terraform -chdir=envs/production init -backend=false

      - name: Validate (production)
        run: terraform -chdir=envs/production validate
