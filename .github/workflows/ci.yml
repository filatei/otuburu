name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Rust engine ─────────────────────────────────────────────────────────────
  rust:
    name: Rust engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-engine

    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-engine/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all

  # ── Go services ─────────────────────────────────────────────────────────────
  go:
    name: Go services
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-services

    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: "go-services/**/go.sum"

      - name: Install protoc-gen-go tools
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.2
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

      - name: Generate proto (gateway)
        working-directory: .
        run: bash scripts/gen-proto-go.sh

      - name: Vet
        run: |
          for mod in account gateway risk-monitor; do
            echo "--- go vet $mod ---"
            (cd $mod && go vet ./...)
          done

      - name: Test
        run: |
          for mod in account gateway risk-monitor; do
            echo "--- go test $mod ---"
            (cd $mod && go test ./... -race -timeout 60s)
          done

  # ── Node demo (legacy) ──────────────────────────────────────────────────────
  node-demo:
    name: Node demo lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Syntax check
        run: node --check engine/server.js engine/engine.js engine/generators.js engine/rng.js

  # ── Staking service ─────────────────────────────────────────────────────────
  staking:
    name: Staking service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: staking

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: staking/package-lock.json

      - name: Install native build tools (for better-sqlite3)
        run: sudo apt-get install -y python3 make g++

      - name: Install dependencies
        run: npm install

      - name: Syntax check — all source files
        run: |
          node --check server.js
          node --check routes.js
          node --check db.js
          node --check paystack.js
          node --check mailer.js

      - name: Smoke test — DB schema migration
        run: |
          node -e "
            process.env.STAKING_DB_PATH = '/tmp/test-staking.db';
            const db = require('./db');
            const algos = db.getAlgorithms();
            console.assert(algos.length === 5, 'Expected 5 algorithms, got ' + algos.length);
            console.log('DB smoke test passed:', algos.map(a => a.id).join(', '));
          "

      - name: Smoke test — JWT auth middleware
        run: |
          node -e "
            const jwt = require('jsonwebtoken');
            const secret = 'test-secret-32-chars-minimum-ok!';
            const token = jwt.sign({ uid: 'u1', aid: 'a1', did: 'd1', email: 'test@test.com' }, secret, { algorithm: 'HS256' });
            const decoded = jwt.verify(token, secret, { algorithms: ['HS256'] });
            console.assert(decoded.uid === 'u1', 'uid mismatch');
            console.assert(decoded.email === 'test@test.com', 'email mismatch');
            console.log('JWT smoke test passed');
          "

  # ── Next.js frontend ─────────────────────────────────────────────────────────
  frontend:
    name: Frontend typecheck + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  # ── Terraform validate ──────────────────────────────────────────────────────
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Init (staging)
        run: terraform -chdir=envs/staging init -backend=false

      - name: Validate (staging)
        run: terraform -chdir=envs/staging validate

      - name: Init (production)
        run: terraform -chdir=envs/production init -backend=false

      - name: Validate (production)
        run: terraform -chdir=envs/production validate
