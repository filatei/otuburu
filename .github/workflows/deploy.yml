name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ENGINE_IMAGE:  ghcr.io/filatei/otuburu-engine
  GATEWAY_IMAGE: ghcr.io/filatei/otuburu-gateway

jobs:
  # ── Build + push Docker images to GHCR ──────────────────────────────────────
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push engine
        uses: docker/build-push-action@v6
        with:
          context: rust-engine
          file:    rust-engine/Dockerfile
          push:    true
          tags:    ${{ env.ENGINE_IMAGE }}:staging,${{ env.ENGINE_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=engine
          cache-to:   type=gha,mode=max,scope=engine

      - name: Build & push gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file:    Dockerfile.gateway
          push:    true
          tags:    ${{ env.GATEWAY_IMAGE }}:staging,${{ env.GATEWAY_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=gateway
          cache-to:   type=gha,mode=max,scope=gateway

  # ── SSH deploy: pull + restart on Linode VPS ────────────────────────────────
  deploy:
    name: Deploy to Linode VPS
    needs: build
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:       ${{ secrets.LINODE_HOST }}
          username:   otuburu
          key:        ${{ secrets.LINODE_SSH_KEY }}
          port:       2525
          script: |
            cd /home/otuburu/app
            # Log into GHCR (token injected at deploy time)
            echo "${{ secrets.GHCR_TOKEN }}" | \
              docker login ghcr.io -u filatei --password-stdin
            bash /home/otuburu/app/deploy.sh
