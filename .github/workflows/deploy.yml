name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ENGINE_IMAGE:  ghcr.io/filatei/otuburu-engine
  GATEWAY_IMAGE: ghcr.io/filatei/otuburu-gateway
  WALLET_IMAGE:  ghcr.io/filatei/otuburu-wallet
  STAKING_IMAGE: ghcr.io/filatei/otuburu-staking

jobs:
  # ── Build + push Docker images to GHCR ─────────────────────────────────────
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Rust engine ──────────────────────────────────────────────────────────
      - name: Build & push engine
        uses: docker/build-push-action@v6
        with:
          context: rust-engine
          file:    rust-engine/Dockerfile
          push:    true
          tags:    ${{ env.ENGINE_IMAGE }}:staging,${{ env.ENGINE_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=engine
          cache-to:   type=gha,mode=max,scope=engine

      # ── Go gateway ───────────────────────────────────────────────────────────
      - name: Build & push gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file:    Dockerfile.gateway
          push:    true
          tags:    ${{ env.GATEWAY_IMAGE }}:staging,${{ env.GATEWAY_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=gateway
          cache-to:   type=gha,mode=max,scope=gateway

      # ── Go wallet ────────────────────────────────────────────────────────────
      - name: Build & push wallet
        uses: docker/build-push-action@v6
        with:
          context: .
          file:    Dockerfile.wallet
          push:    true
          tags:    ${{ env.WALLET_IMAGE }}:staging,${{ env.WALLET_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=wallet
          cache-to:   type=gha,mode=max,scope=wallet

      # ── Node.js staking service ───────────────────────────────────────────────
      - name: Build & push staking
        uses: docker/build-push-action@v6
        with:
          context: .
          file:    Dockerfile.staking
          push:    true
          tags:    ${{ env.STAKING_IMAGE }}:staging,${{ env.STAKING_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=staking
          cache-to:   type=gha,mode=max,scope=staking

  # ── Build Next.js frontend → static export ─────────────────────────────────
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    # Must declare the same environment as the deploy job so that
    # GOOGLE_CLIENT_ID (and any other Environment-scoped secret) is
    # visible here. Without this, NEXT_PUBLIC_GOOGLE_CLIENT_ID gets
    # baked into the bundle as an empty string and the AuthModal shows
    # "NEXT_PUBLIC_GOOGLE_CLIENT_ID not set" to live visitors.
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Build static export
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL:          https://otuburu.torama.money
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-out
          path: web/out/
          retention-days: 1

  # ── SSH deploy: copy files + restart containers ─────────────────────────────
  deploy:
    name: Deploy to Linode VPS
    needs: [build, frontend]
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: frontend-out/

      # ── Ensure deploy dirs exist (otuburu owns, user1 writes via group) ─────────
      - name: Prepare server directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key:      ${{ secrets.LINODE_SSH_KEY }}
          port:     ${{ secrets.LINODE_SSH_PORT }}
          script: |
            # Frontend: user1 owns it — SCP extracts tar here directly
            sudo mkdir -p /opt/otuburu/frontend
            sudo chown -R user1:otuburu /opt/otuburu/frontend
            sudo chmod -R 775 /opt/otuburu/frontend
            sudo chmod -R g-s /opt/otuburu/frontend

            # Backend: otuburu owns it — no tar extraction, setgid fine
            sudo mkdir -p /opt/otuburu/backend/infra
            sudo chown -R otuburu:otuburu /opt/otuburu/backend
            sudo chmod -R g+rwXs /opt/otuburu/backend

            # Ensure user1 can manage Apache without a password
            # (scoped to only the commands the deploy pipeline needs)
            cat <<'SUDOEOF' | sudo tee /etc/sudoers.d/user1-apache >/dev/null
            user1 ALL=(ALL) NOPASSWD: \
              /usr/sbin/a2enmod, \
              /usr/sbin/a2ensite, \
              /usr/sbin/apache2ctl, \
              /bin/systemctl reload apache2, \
              /bin/systemctl status apache2, \
              /bin/cp /opt/otuburu/backend/infra/* /etc/apache2/sites-available/*
            SUDOEOF
            sudo chmod 440 /etc/sudoers.d/user1-apache

      # ── Static frontend ───────────────────────────────────────────────────────
      - name: Copy frontend to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key:      ${{ secrets.LINODE_SSH_KEY }}
          port:     ${{ secrets.LINODE_SSH_PORT }}
          source:   "frontend-out/*"
          target:   "/opt/otuburu/frontend"
          strip_components: 1

      # ── docker-compose ────────────────────────────────────────────────────────
      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key:      ${{ secrets.LINODE_SSH_KEY }}
          port:     ${{ secrets.LINODE_SSH_PORT }}
          source:   "docker-compose.staging.yml"
          target:   "/opt/otuburu/backend"

      # ── deploy script ─────────────────────────────────────────────────────────
      - name: Copy deploy script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key:      ${{ secrets.LINODE_SSH_KEY }}
          port:     ${{ secrets.LINODE_SSH_PORT }}
          source:   "scripts/deploy.sh"
          target:   "/opt/otuburu/backend"
          strip_components: 1

      # ── DB schema (wallet PostgreSQL) ─────────────────────────────────────────
      # NOTE: target must be the *directory*, not the filename. If target ends in
      # the leaf name and that path doesn't yet exist, scp-action creates it as
      # an empty DIRECTORY and extracts into it (broken). strip_components: 4
      # removes "go-services/wallet/internal/db/" so the bare "schema.sql" lands
      # at /opt/otuburu/backend/schema.sql as a file.
      - name: Copy schema.sql to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key:      ${{ secrets.LINODE_SSH_KEY }}
          port:     ${{ secrets.LINODE_SSH_PORT }}
          source:   "go-services/wallet/internal/db/schema.sql"
          target:   "/opt/otuburu/backend"
          strip_components: 4

      # ── Apache vhost (now includes /api/stake/ + /staking proxy) ─────────────
      - name: Copy Apache config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key:      ${{ secrets.LINODE_SSH_KEY }}
          port:     ${{ secrets.LINODE_SSH_PORT }}
          source:   "infra/apache/otuburu.torama.money.conf"
          target:   "/opt/otuburu/backend/infra"
          strip_components: 2

      # ── Write .env + pull images + restart all services ───────────────────────
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key:      ${{ secrets.LINODE_SSH_KEY }}
          port:     ${{ secrets.LINODE_SSH_PORT }}
          script: |
            set -e

            # Rename docker-compose file to canonical name
            mv -f /opt/otuburu/backend/docker-compose.staging.yml \
                  /opt/otuburu/backend/docker-compose.yml 2>/dev/null || true

            # Make deploy script executable
            chmod +x /opt/otuburu/backend/deploy.sh

            # Install Apache vhost if it changed
            if ! diff -q /opt/otuburu/backend/infra/otuburu.torama.money.conf \
                         /etc/apache2/sites-available/otuburu.conf >/dev/null 2>&1; then
              sudo -n cp /opt/otuburu/backend/infra/otuburu.torama.money.conf \
                         /etc/apache2/sites-available/otuburu.conf \
                || echo "WARNING: could not update Apache vhost"
            fi

            # Write .env from GitHub Secrets (fresh on every deploy)
            # ── Core services ──────────────────────────────────────────────────
            cat > /opt/otuburu/backend/.env << 'ENVEOF'
            POSTGRES_USER=${{ secrets.POSTGRES_USER || 'otuburu' }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB || 'otuburu' }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}
            GATEWAY_URL=${{ secrets.GATEWAY_URL || 'http://gateway:8082' }}
            WALLET_MNEMONIC=${{ secrets.WALLET_MNEMONIC }}
            TRONGRID_API_KEY=${{ secrets.TRONGRID_API_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            ADMIN_SECRET=${{ secrets.ADMIN_SECRET }}
            # ── Alpaca real-time market data (engine) ─────────────────────────
            APCA_API_KEY_ID=${{ secrets.APCA_API_KEY_ID }}
            APCA_API_SECRET_KEY=${{ secrets.APCA_API_SECRET_KEY }}
            # ── Paystack (NGN deposits + NGN withdrawals via Transfer API) ────
            PAYSTACK_SECRET_KEY=${{ secrets.PAYSTACK_SECRET_KEY }}
            PAYSTACK_PUBLIC_KEY=${{ secrets.PAYSTACK_PUBLIC_KEY }}
            # Paystack success-callback base. Without this, Paystack returns
            # users to a bare '?deposit=success' (relative) on their hosted
            # page which is rejected as an invalid redirect.
            APP_URL=${{ secrets.APP_URL || 'https://otuburu.torama.money' }}
            USD_TO_NGN_RATE=${{ secrets.USD_TO_NGN_RATE || '1600' }}
            SMTP_HOST=${{ secrets.SMTP_HOST || 'smtp-relay.gmail.com' }}
            SMTP_PORT=${{ secrets.SMTP_PORT || '587' }}
            SMTP_SECURE=${{ secrets.SMTP_SECURE || 'false' }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_FROM=${{ secrets.SMTP_FROM || 'Otuburu <noreply@torama.money>' }}
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL || 'filatei@gtsng.com' }}
            ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS || 'filatei@gtsng.com' }}
            ENVEOF

            # Login to GHCR and deploy
            echo "${{ secrets.GHCR_TOKEN }}" | \
              docker login ghcr.io -u filatei --password-stdin

            bash /opt/otuburu/backend/deploy.sh
