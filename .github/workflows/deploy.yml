name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ENGINE_IMAGE:  ghcr.io/filatei/otuburu-engine
  GATEWAY_IMAGE: ghcr.io/filatei/otuburu-gateway
  WALLET_IMAGE:  ghcr.io/filatei/otuburu-wallet

jobs:
  # ── Build + push Docker images to GHCR ──────────────────────────────────────
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push engine
        uses: docker/build-push-action@v6
        with:
          context: rust-engine
          file:    rust-engine/Dockerfile
          push:    true
          tags:    ${{ env.ENGINE_IMAGE }}:staging,${{ env.ENGINE_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=engine
          cache-to:   type=gha,mode=max,scope=engine

      - name: Build & push gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file:    Dockerfile.gateway
          push:    true
          tags:    ${{ env.GATEWAY_IMAGE }}:staging,${{ env.GATEWAY_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=gateway
          cache-to:   type=gha,mode=max,scope=gateway

      - name: Build & push wallet
        uses: docker/build-push-action@v6
        with:
          context: .
          file:    Dockerfile.wallet
          push:    true
          tags:    ${{ env.WALLET_IMAGE }}:staging,${{ env.WALLET_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=wallet
          cache-to:   type=gha,mode=max,scope=wallet

  # ── Build Next.js frontend → static export ──────────────────────────────────
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Build static export
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL:          https://otuburu.torama.money
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-out
          path: web/out/
          retention-days: 1

  # ── SSH deploy: copy files + restart containers ──────────────────────────────
  deploy:
    name: Deploy to Linode VPS
    needs: [build, frontend]
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: frontend-out/

      # Deploy frontend → /opt/otuburu/frontend/
      - name: Copy frontend to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.LINODE_HOST }}
          username: otuburu
          key:      ${{ secrets.LINODE_SSH_KEY }}
          port:     22
          source:   "frontend-out/*"
          target:   "/opt/otuburu/frontend"
          strip_components: 1

      # Deploy docker-compose → /opt/otuburu/backend/
      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.LINODE_HOST }}
          username: otuburu
          key:      ${{ secrets.LINODE_SSH_KEY }}
          port:     22
          source:   "docker-compose.staging.yml"
          target:   "/opt/otuburu/backend"

      # Copy deploy script
      - name: Copy deploy script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.LINODE_HOST }}
          username: otuburu
          key:      ${{ secrets.LINODE_SSH_KEY }}
          port:     22
          source:   "scripts/deploy.sh"
          target:   "/opt/otuburu/backend"

      # Copy DB schema (postgres init — only used on first boot)
      - name: Copy schema.sql to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.LINODE_HOST }}
          username: otuburu
          key:      ${{ secrets.LINODE_SSH_KEY }}
          port:     22
          source:   "go-services/wallet/internal/db/schema.sql"
          target:   "/opt/otuburu/backend/schema.sql"
          strip_components: 5

      # Copy Apache vhost config
      - name: Copy Apache config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.LINODE_HOST }}
          username: otuburu
          key:      ${{ secrets.LINODE_SSH_KEY }}
          port:     22
          source:   "infra/apache/otuburu.torama.money.conf"
          target:   "/opt/otuburu/backend/infra"

      # Write .env + pull images + restart
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.LINODE_HOST }}
          username: otuburu
          key:      ${{ secrets.LINODE_SSH_KEY }}
          port:     22
          script: |
            set -e

            # Rename docker-compose file to canonical name
            mv -f /opt/otuburu/backend/docker-compose.staging.yml \
                  /opt/otuburu/backend/docker-compose.yml 2>/dev/null || true

            # Make deploy script executable
            chmod +x /opt/otuburu/backend/deploy.sh

            # Install Apache vhost if it changed
            if ! diff -q /opt/otuburu/backend/infra/otuburu.torama.money.conf \
                         /etc/apache2/sites-available/otuburu.conf >/dev/null 2>&1; then
              sudo cp /opt/otuburu/backend/infra/otuburu.torama.money.conf \
                      /etc/apache2/sites-available/otuburu.conf
            fi

            # Write .env from GitHub Secrets (fresh on every deploy)
            cat > /opt/otuburu/backend/.env << 'EOF'
            POSTGRES_USER=otuburu
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=otuburu
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            WALLET_MNEMONIC=${{ secrets.WALLET_MNEMONIC }}
            TRONGRID_API_KEY=${{ secrets.TRONGRID_API_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            ADMIN_SECRET=${{ secrets.ADMIN_SECRET }}
            EOF

            # Login to GHCR and deploy
            echo "${{ secrets.GHCR_TOKEN }}" | \
              docker login ghcr.io -u filatei --password-stdin

            bash /opt/otuburu/backend/deploy.sh
