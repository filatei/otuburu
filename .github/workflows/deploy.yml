name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ENGINE_IMAGE:  ghcr.io/filatei/otuburu-engine
  GATEWAY_IMAGE: ghcr.io/filatei/otuburu-gateway
  WALLET_IMAGE:  ghcr.io/filatei/otuburu-wallet

jobs:
  # ── Build + push Docker images to GHCR ──────────────────────────────────────
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push engine
        uses: docker/build-push-action@v6
        with:
          context: rust-engine
          file:    rust-engine/Dockerfile
          push:    true
          tags:    ${{ env.ENGINE_IMAGE }}:staging,${{ env.ENGINE_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=engine
          cache-to:   type=gha,mode=max,scope=engine

      - name: Build & push gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file:    Dockerfile.gateway
          push:    true
          tags:    ${{ env.GATEWAY_IMAGE }}:staging,${{ env.GATEWAY_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=gateway
          cache-to:   type=gha,mode=max,scope=gateway

      - name: Build & push wallet
        uses: docker/build-push-action@v6
        with:
          context: .
          file:    Dockerfile.wallet
          push:    true
          tags:    ${{ env.WALLET_IMAGE }}:staging,${{ env.WALLET_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=wallet
          cache-to:   type=gha,mode=max,scope=wallet

  # ── Build Next.js frontend → static export ──────────────────────────────────
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Build static export
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: https://otuburu.torama.money
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-out
          path: web/out/
          retention-days: 1

  # ── SSH deploy: pull + restart on Linode VPS ────────────────────────────────
  deploy:
    name: Deploy to Linode VPS
    needs: [build, frontend]
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: frontend-out/

      - name: Copy frontend to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.LINODE_HOST }}
          username: otuburu
          key:      ${{ secrets.LINODE_SSH_KEY }}
          port:     22
          source:   "frontend-out/*"
          target:   "/var/www/otuburu"
          strip_components: 1

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.LINODE_HOST }}
          username: otuburu
          key:      ${{ secrets.LINODE_SSH_KEY }}
          port:     22
          script: |
            # Deploy backend containers
            cd /home/otuburu/app
            echo "${{ secrets.GHCR_TOKEN }}" | \
              docker login ghcr.io -u filatei --password-stdin
            bash /home/otuburu/app/deploy.sh
