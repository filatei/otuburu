syntax = "proto3";
package otuburu.engine.v1;

option go_package = "otuburu.money/proto/enginepb";

// ─── Shared types ────────────────────────────────────────────────────────────

message Tick {
  string symbol     = 1;
  int64  ts_ms      = 2;   // Unix milliseconds
  double mid        = 3;
  double bid        = 4;
  double ask        = 5;
  uint64 tick_index = 6;
}

// CFD position (with optional TP / SL)
message Position {
  string id             = 1;  // UUID
  string account_id     = 2;
  string symbol         = 3;
  string side           = 4;  // "BUY" | "SELL"
  double lots           = 5;
  double entry          = 6;
  double margin         = 7;
  double notional       = 8;
  double unrealised_pnl = 9;
  int64  opened_at_ms   = 10;
  // Optional TP/SL — 0 means not set
  double tp_profit      = 11;  // close when profit ≥ this USD amount
  double sl_loss        = 12;  // close when loss   ≥ this USD amount (positive)
}

// Fractional spot position (1:1 leverage, balance debited upfront)
message SpotPosition {
  string id             = 1;
  string account_id     = 2;
  string symbol         = 3;
  string side           = 4;  // "BUY" | "SELL"
  double stake          = 5;  // USD committed
  double units          = 6;  // asset units owned
  double entry          = 7;
  double unrealised_pnl = 8;
  int64  opened_at_ms   = 9;
  double tp_profit      = 10;
  double sl_loss        = 11;
}

message BinaryOption {
  string id           = 1;
  string account_id   = 2;
  string symbol       = 3;
  string direction    = 4;  // "UP" | "DOWN"
  double stake        = 5;
  uint32 ticks_total  = 6;
  uint32 ticks_left   = 7;
  double entry_mid    = 8;
  int64  opened_at_ms = 9;
}

message AccountState {
  string id           = 1;
  string currency     = 2;
  double balance      = 3;
  double equity       = 4;
  double used_margin  = 5;
  double free_margin  = 6;
  double margin_level = 7;
  double realised_pnl = 8;
  string label        = 9;   // "Demo" | user-defined name
  bool   is_demo      = 10;
}

message HouseStats {
  double total_spread_captured = 1;
  double total_payout_margin   = 2;
  double total_client_pnl      = 3;
  double house_net             = 4;
  uint64 binary_count          = 5;
  uint64 binary_wins           = 6;
  uint64 cfd_count             = 7;
  double binary_win_rate       = 8;
  double payout_multiplier     = 9;
  double expected_house_edge   = 10;
  uint64 spot_count            = 11;
}

// Candle for chart history
message Candle {
  int64  ts_s  = 1;   // unix seconds, floored to resolution
  double open  = 2;
  double high  = 3;
  double low   = 4;
  double close = 5;
}

// Settled binary option trade
message SettledTrade {
  string id            = 1;
  string account_id    = 2;
  string symbol        = 3;
  string direction     = 4;  // "UP" | "DOWN"
  double stake         = 5;
  double payout        = 6;
  bool   won           = 7;
  double entry_mid     = 8;
  double exit_mid      = 9;
  uint32 ticks_total   = 10;
  int64  opened_at_ms  = 11;
  int64  settled_at_ms = 12;
}

// Closed spot position (auto-closed by TP/SL or manual close)
message ClosedSpot {
  SpotPosition position = 1;
  double       exit     = 2;
  double       pnl      = 3;
}

// ─── EngineService ───────────────────────────────────────────────────────────

service EngineService {
  // Stream of live ticks for all symbols
  rpc SubscribeTicks (SubscribeTicksRequest)  returns (stream Tick);

  // Full state snapshot (account + positions + binaries + spots + quotes + house)
  rpc GetState       (GetStateRequest)        returns (StateSnapshot);

  // CFD order management
  rpc PlaceOrder     (PlaceOrderRequest)      returns (PlaceOrderResponse);
  rpc ClosePosition  (ClosePositionRequest)   returns (ClosePositionResponse);

  // Digital options
  rpc PlaceBinary    (PlaceBinaryRequest)     returns (PlaceBinaryResponse);

  // Fractional spot trading
  rpc PlaceSpot      (PlaceSpotRequest)       returns (PlaceSpotResponse);
  rpc CloseSpot      (CloseSpotRequest)       returns (CloseSpotResponse);

  // Symbol catalogue
  rpc GetSymbols     (GetSymbolsRequest)      returns (GetSymbolsResponse);

  // Account management
  rpc CreateAccount  (CreateAccountRequest)   returns (CreateAccountResponse);
  rpc ListAccounts   (ListAccountsRequest)    returns (ListAccountsResponse);
  // Apply a signed delta to a live account's balance — used by the wallet
  // service for internal transfers (savings ↔ account, account ↔ account).
  // Unlike CreateAccount, this RPC happily updates accounts with open
  // positions, but rejects any debit that would push equity below the
  // free-margin floor (current free_margin + delta < 0).
  rpc AdjustBalance  (AdjustBalanceRequest)   returns (AdjustBalanceResponse);

  // Chart history (OHLC candles)
  rpc GetCandles     (GetCandlesRequest)      returns (GetCandlesResponse);

  // Trade history (settled binary options)
  rpc GetTradeHistory (GetTradeHistoryRequest) returns (GetTradeHistoryResponse);

  // Admin — flip an account between Synthetic and Passthrough routing.
  // Sprint 5.5e. Gated at the gateway by ADMIN_SECRET (Bearer); the
  // engine itself doesn't re-check auth, so this RPC must NEVER be
  // exposed without a trusted edge in front of it.
  rpc SetAccountRoutingMode (SetAccountRoutingModeRequest) returns (SetAccountRoutingModeResponse);
}

// ─── Request / Response messages ─────────────────────────────────────────────

message SubscribeTicksRequest {
  // Empty = subscribe to all symbols; set symbols to filter
  repeated string symbols = 1;
}

message GetStateRequest {
  string account_id = 1;
}

message StateSnapshot {
  AccountState              account   = 1;
  repeated Position         positions = 2;
  repeated BinaryOption     binaries  = 3;
  map<string, Tick>         quotes    = 4;
  HouseStats                house     = 5;
  repeated SpotPosition     spots     = 6;
}

message PlaceOrderRequest {
  string account_id = 1;
  string symbol     = 2;
  string side       = 3;   // "BUY" | "SELL"
  double lots       = 4;
  // Optional TP/SL — omit or set to 0 to disable
  double tp_profit  = 5;
  double sl_loss    = 6;
}

message PlaceOrderResponse {
  oneof result {
    Position position = 1;
    string   error    = 2;
  }
}

message ClosePositionRequest {
  string account_id  = 1;
  string position_id = 2;
}

message ClosePositionResponse {
  oneof result {
    ClosedPosition closed = 1;
    string         error  = 2;
  }
}

message ClosedPosition {
  Position position = 1;
  double   exit     = 2;
  double   pnl      = 3;
}

message PlaceBinaryRequest {
  string account_id = 1;
  string symbol     = 2;
  string direction  = 3;  // "UP" | "DOWN"
  double stake      = 4;
  uint32 ticks      = 5;
}

message PlaceBinaryResponse {
  oneof result {
    BinaryOption binary = 1;
    string       error  = 2;
  }
}

// ── Spot trading ───────────────────────────────────────────────────────────────

message PlaceSpotRequest {
  string account_id = 1;
  string symbol     = 2;
  string side       = 3;   // "BUY" | "SELL"
  double stake      = 4;   // USD amount to commit
  double tp_profit  = 5;   // optional take-profit in USD profit (0 = disabled)
  double sl_loss    = 6;   // optional stop-loss in USD loss magnitude (0 = disabled)
}

message PlaceSpotResponse {
  oneof result {
    SpotPosition spot  = 1;
    string       error = 2;
  }
}

message CloseSpotRequest {
  string account_id = 1;
  string spot_id    = 2;
}

message CloseSpotResponse {
  oneof result {
    ClosedSpot closed = 1;
    string     error  = 2;
  }
}

// ── Symbols ────────────────────────────────────────────────────────────────────

message GetSymbolsRequest {}

message GetSymbolsResponse {
  repeated SymbolInfo symbols = 1;
}

message SymbolInfo {
  string symbol          = 1;  // internal id, e.g. "cryBTCUSD" — used in API calls
  string type            = 2;  // "BOOM_CRASH" | "FX" | "CRYPTO" | "METAL"
  uint32 leverage        = 3;
  double contract_size   = 4;
  uint32 cadence_ms      = 5;  // tick interval
  // Display-only price divisor. Engine stores true prices; frontends should
  // divide bid/ask/entry/mark by this value at render time for high-priced
  // assets (e.g. BTC=1000 shows $108 instead of $108k). PnL is always in real
  // USD and never divided. Default 1.0 = no scaling.
  double display_divisor = 6;
  // User-facing symbol name, e.g. "BTCUSD" for internal "cryBTCUSD". Frontends
  // should use this for all rendering; `symbol` (field 1) is the internal id
  // used in API calls. Defaults to `symbol` unchanged when no rename applies.
  string display_symbol  = 7;
}

// ── Account management ────────────────────────────────────────────────────────

message CreateAccountRequest {
  string account_id      = 1;  // pre-assigned UUID from wallet service
  string label           = 2;  // e.g. "Demo" | "Main" | user-defined
  bool   is_demo         = 3;
  double initial_balance = 4;  // 0 = default 10 000 USD
}

message CreateAccountResponse {
  string account_id = 1;
}

message ListAccountsRequest {
  repeated string account_ids = 1;
}

message ListAccountsResponse {
  repeated AccountState accounts = 1;
}

// AdjustBalance — apply a signed USD delta. positive credits, negative debits.
// The engine rejects with accepted=false when delta<0 and -delta>free_margin,
// returning the current free_margin so the caller can surface a precise
// "you can move at most $X" message to the user without an extra round-trip.
message AdjustBalanceRequest {
  string account_id = 1;
  double delta      = 2;  // positive = credit, negative = debit
  string reason     = 3;  // free-form, ends up in engine logs only
}

message AdjustBalanceResponse {
  bool   accepted        = 1;
  string reject_reason   = 2;  // empty when accepted=true
  double new_balance     = 3;
  double new_free_margin = 4;
}

// ── Admin: account routing mode ───────────────────────────────────────────────

message SetAccountRoutingModeRequest {
  string account_id   = 1;
  string routing_mode = 2;  // "synthetic" | "passthrough"
}

message SetAccountRoutingModeResponse {
  bool   accepted = 1;
  string error    = 2;  // empty when accepted=true
  // Routing mode BEFORE the change. Always populated on accepted=true
  // so the gateway's admin_audit_log can record the diff. Empty on
  // accepted=false.
  string previous = 3;
  // Routing mode AFTER the change. Echoes the requested value when
  // accepted=true. Empty on accepted=false.
  string current  = 4;
}

// ── Chart history ─────────────────────────────────────────────────────────────

message GetCandlesRequest {
  string symbol     = 1;
  string resolution = 2;  // "M1"|"M5"|"M15"|"M30"|"H1"|"H4"|"D1"
  int64  from_ms    = 3;
  int64  to_ms      = 4;
}

message GetCandlesResponse {
  string          resolution = 1;
  repeated Candle candles    = 2;
}

// ── Trade history ─────────────────────────────────────────────────────────────

message GetTradeHistoryRequest {
  string account_id = 1;
  string symbol     = 2;  // empty = all symbols
  int64  from_ms    = 3;
  int64  to_ms      = 4;
  uint32 limit      = 5;  // 0 = default 200
}

message GetTradeHistoryResponse {
  repeated SettledTrade trades = 1;
}
