[workspace]
resolver = "2"
members = [
    ".",                        # otuburu-engine binary
    "crates/feed-generator",
    "crates/order-book",
    "crates/risk-engine",
    "crates/binary-options",
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
authors     = ["Otuburu Engineering <eng@torama.money>"]
license     = "UNLICENSED"

[workspace.dependencies]
# async runtime
tokio        = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }   # "sync" needed for BroadcastStream wrapper
# serialisation
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
# gRPC
tonic        = "0.12"
prost        = "0.13"
# observability
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# maths / stats
rand         = "0.8"
rand_chacha  = "0.3"           # ChaCha20 CSPRNG — §8.1 of Architecture Plan
statrs       = "0.17"
# error handling
anyhow       = "1"
thiserror    = "1"
# config
config       = "0.14"
# DB
sqlx         = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "chrono"] }
uuid         = { version = "1", features = ["v4", "serde"] }
chrono       = { version = "0.4", features = ["serde"] }
# build-time proto compilation
tonic-build  = "0.12"

[package]
name        = "otuburu-engine"
description = "Otuburu trading engine — gRPC server wrapping feed-generator, order-book, risk-engine, binary-options"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "otuburu-engine"
path = "src/main.rs"

[dependencies]
feed-generator = { path = "crates/feed-generator" }
order-book     = { path = "crates/order-book" }
risk-engine    = { path = "crates/risk-engine" }
binary-options = { path = "crates/binary-options" }
tokio.workspace             = true
tokio-stream.workspace      = true
tonic.workspace             = true
prost.workspace             = true
serde.workspace             = true
serde_json.workspace        = true
tracing.workspace           = true
tracing-subscriber.workspace = true
anyhow.workspace            = true
thiserror.workspace         = true
config.workspace            = true
uuid.workspace              = true
chrono.workspace            = true
sqlx.workspace              = true

[build-dependencies]
tonic-build = "0.12"
