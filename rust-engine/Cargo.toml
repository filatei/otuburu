[workspace]
resolver = "2"
members = [
    "crates/feed-generator",
    "crates/order-book",
    "crates/risk-engine",
    "crates/binary-options",
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
authors     = ["Otuburu Engineering <eng@torama.money>"]
license     = "UNLICENSED"

[workspace.dependencies]
# async runtime
tokio        = { version = "1", features = ["full"] }
tokio-stream = "0.1"
# serialisation
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
# gRPC
tonic        = "0.12"
prost        = "0.13"
# observability
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# maths / stats
rand         = "0.8"
rand_chacha  = "0.3"           # ChaCha20 CSPRNG — §8.1 of Architecture Plan
statrs       = "0.17"
# error handling
anyhow       = "1"
thiserror    = "1"
# config
config       = "0.14"
# DB
sqlx         = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
uuid         = { version = "1", features = ["v4", "serde"] }
chrono       = { version = "0.4", features = ["serde"] }
