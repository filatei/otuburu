services:

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-otuburu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-otuburu}
      POSTGRES_DB:       ${POSTGRES_DB:-otuburu}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    expose:
      - "5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otuburu"]
      interval: 10s
      timeout: 5s
      retries: 5

  engine:
    image: ghcr.io/filatei/otuburu-engine:staging
    restart: always
    environment:
      ENGINE_GRPC_ADDR:     "0.0.0.0:9090"
      RUST_LOG:             "otuburu_engine=info,warn"
      SNAPSHOT_PATH:        "/data/engine_snapshot.json"
      DB_URL:               "sqlite:///data/otuburu.db"
      APCA_API_KEY_ID:      ${APCA_API_KEY_ID:-}
      APCA_API_SECRET_KEY:  ${APCA_API_SECRET_KEY:-}
      # Sprint 5.8 — Postgres for per-user LP routing. Engine reads
      # user_lp_links from this DB at place_order time when an
      # account is in passthrough mode. Best-effort connect at boot:
      # unreachable → engine continues with global LP fallback.
      POSTGRES_HOST:        "postgres"
      POSTGRES_USER:        ${POSTGRES_USER:-otuburu}
      POSTGRES_PASSWORD:    ${POSTGRES_PASSWORD:-otuburu}
      POSTGRES_DB:          ${POSTGRES_DB:-otuburu}
      # pgcrypto symmetric key — must match the gateway's value
      # exactly. Without it, decryption produces garbage and per-user
      # routing falls back to the global LP. Set in deploy.yml from
      # GitHub Secrets.
      LP_LINK_KEY:          ${LP_LINK_KEY:-}
      # Exness cent accounts (USC currency) suffix instrument names —
      # e.g. EURUSD -> EURUSDm. Empty = no suffix (standard MT5 accounts).
      # Discoverable via GET /users/current/accounts/<id>/symbols on
      # the MetaApi REST API.
      METAAPI_SYMBOL_SUFFIX: ${METAAPI_SYMBOL_SUFFIX:-}
    volumes:
      - enginedata:/data
    expose:
      - "9090"
    networks:
      - internal
    depends_on:
      - postgres
    healthcheck:
      # nc is available in slim images; checks gRPC port is accepting connections
      test: ["CMD", "nc", "-z", "localhost", "9090"]
      interval: 30s
      timeout: 5s
      retries: 3

  gateway:
    image: ghcr.io/filatei/otuburu-gateway:staging
    restart: always
    environment:
      PORT:            "8082"
      ENGINE_ADDR:     "engine:9090"
      JWT_SECRET:      ${JWT_SECRET:-change-me-in-production}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-}
      # Gates POST /api/admin/* (Sprint 5.5e adds account routing-mode
      # flip). Same secret rotates across gateway + wallet services.
      # If unset, adminMiddleware returns 503 to fail closed rather
      # than allow unrestricted admin.
      ADMIN_SECRET:    ${ADMIN_SECRET:-}
      # Sprint 5.8 — symmetric encryption key for user broker
      # credentials (user_lp_links.token_enc). pgcrypto's
      # pgp_sym_encrypt/decrypt key. If unset, the broker-linking
      # endpoints return 503 — fails closed so tokens never land in
      # DB cleartext. Generate with `openssl rand -hex 48`.
      LP_LINK_KEY:     ${LP_LINK_KEY:-}
      # Postgres connection for admin_audit_log (Sprint 5.5f). Same DB
      # instance as wallet — gateway gets its own pool. If postgres
      # is unreachable on boot, gateway logs a warn and continues
      # without audit (admin actions still work, just no DB trail).
      POSTGRES_HOST:     "postgres"
      POSTGRES_USER:     ${POSTGRES_USER:-otuburu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-otuburu}
      POSTGRES_DB:       ${POSTGRES_DB:-otuburu}
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      - internal
    depends_on:
      - engine
      - postgres
    healthcheck:
      # Go binary has /healthz; use nc to avoid needing wget/curl in slim image
      test: ["CMD", "nc", "-z", "localhost", "8082"]
      interval: 30s
      timeout: 5s
      retries: 3

  wallet:
    image: ghcr.io/filatei/otuburu-wallet:staging
    restart: always
    environment:
      PORT:              "8083"
      POSTGRES_HOST:     "postgres"
      POSTGRES_USER:     ${POSTGRES_USER:-otuburu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-otuburu}
      POSTGRES_DB:       ${POSTGRES_DB:-otuburu}
      JWT_SECRET:        ${JWT_SECRET:-change-me-in-production}
      INTERNAL_SECRET:   ${INTERNAL_SECRET:-}
      GATEWAY_URL:       ${GATEWAY_URL:-http://gateway:8082}
      WALLET_MNEMONIC:   ${WALLET_MNEMONIC:-}
      TRONGRID_API_KEY:  ${TRONGRID_API_KEY:-}
      GOOGLE_CLIENT_ID:  ${GOOGLE_CLIENT_ID:-}
      ADMIN_SECRET:      ${ADMIN_SECRET:-}
      # Transactional email (shared SMTP config with staking)
      SMTP_HOST:         ${SMTP_HOST:-smtp-relay.gmail.com}
      SMTP_PORT:         ${SMTP_PORT:-587}
      SMTP_USER:         ${SMTP_USER:-}
      SMTP_PASS:         ${SMTP_PASS:-}
      SMTP_FROM:         ${SMTP_FROM:-Otuburu <noreply@torama.money>}
      # Admin email recipient(s) — used by /wallet/contact (user→admin
      # contact form) and any other admin notification flows. ADMIN_EMAILS
      # takes priority (comma-separated for a team); ADMIN_EMAIL is the
      # single-recipient fallback. Both already populated in .env from
      # GitHub Secrets, but they need to be passed through here for the
      # container to see them.
      ADMIN_EMAIL:       ${ADMIN_EMAIL:-filatei@gtsng.com}
      ADMIN_EMAILS:      ${ADMIN_EMAILS:-filatei@gtsng.com}
      # Paystack — NGN deposit (POST /payments/paystack/initiate) and
      # NGN withdrawal (Transfer API). If unset, payments.New() returns
      # nil and RegisterRoutes is a no-op, which means the wallet returns
      # a gin 404 'page not found' on /payments/paystack/initiate. Was
      # the silent failure mode behind the user-visible
      # 'Unexpected non-whitespace character after JSON at position 4'.
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      # Monnify — instant NGN deposits (reserved virtual accounts) + NGN
      # disbursements (withdrawal fail-over). If API key / secret / contract
      # are unset, NewMonnify() returns nil and the virtual-account rail is
      # simply disabled — same nil-safe pattern as Paystack above.
      # MONNIFY_SECRET_KEY also keys the webhook HMAC-SHA512 verification.
      # MONNIFY_WALLET_ACCOUNT is optional: omit to run deposits only (no
      # payouts). MONNIFY_BASE_URL defaults to live; set the sandbox URL to
      # test. See payments/README_PAYMENTS_MULTIPSP.md.
      MONNIFY_API_KEY:        ${MONNIFY_API_KEY:-}
      MONNIFY_SECRET_KEY:     ${MONNIFY_SECRET_KEY:-}
      MONNIFY_CONTRACT_CODE:  ${MONNIFY_CONTRACT_CODE:-}
      MONNIFY_WALLET_ACCOUNT: ${MONNIFY_WALLET_ACCOUNT:-}
      MONNIFY_BASE_URL:       ${MONNIFY_BASE_URL:-https://api.monnify.com}
      # Frontend redirect target for Paystack's success callback URL.
      APP_URL:           ${APP_URL:-https://otuburu.torama.money}
      # Smile Identity — KYC tier 1 (NIN/BVN/passport verification).
      # While unset, wallet uses the stub provider that auto-approves
      # every submission (logs a loud warning at boot). Switch to live
      # by setting all three in GitHub Secrets.
      SMILE_PARTNER_ID:  ${SMILE_PARTNER_ID:-}
      SMILE_API_KEY:     ${SMILE_API_KEY:-}
      SMILE_ENV:         ${SMILE_ENV:-sandbox}
    ports:
      - "127.0.0.1:8083:8083"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8083"]
      interval: 30s
      timeout: 5s
      retries: 3

  staking:
    image: ghcr.io/filatei/otuburu-staking:staging
    restart: always
    environment:
      PORT:                "8084"
      NODE_ENV:            "production"
      BASE_URL:            "https://otuburu.torama.money"
      JWT_SECRET:          ${JWT_SECRET:-change-me-in-production-use-32-chars-min}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      USD_TO_NGN_RATE:     ${USD_TO_NGN_RATE:-1600}
      SMTP_HOST:           ${SMTP_HOST:-smtp-relay.gmail.com}
      SMTP_PORT:           ${SMTP_PORT:-587}
      SMTP_SECURE:         ${SMTP_SECURE:-false}
      SMTP_USER:           ${SMTP_USER:-}
      SMTP_PASS:           ${SMTP_PASS:-}
      SMTP_FROM:           ${SMTP_FROM:-Otuburu <noreply@torama.money>}
      ADMIN_EMAIL:         ${ADMIN_EMAIL:-filatei@gtsng.com}
      ADMIN_EMAILS:        ${ADMIN_EMAILS:-filatei@gtsng.com}
      STAKING_DB_PATH:     "/data/staking.db"
    ports:
      - "127.0.0.1:8084:8084"
    volumes:
      - stakingdata:/data
    networks:
      - internal
    healthcheck:
      # node is always available in the Node.js image; avoids needing nc/curl
      test: ["CMD", "node", "-e",
        "require('http').get('http://localhost:8084/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Dedicated ingress — Cloudflare proxies otuburu.torama.money here on :2087
  # (Origin Rule sets the port), bypassing the shared Apache. Replicates the
  # Apache path routing (gateway/wallet/staking + static frontend).
  #
  # PREREQUISITES before the first deploy that includes this service:
  #   1. deploy.yml SCPs infra/caddy/Caddyfile  → /opt/otuburu/backend/infra/caddy/ (done)
  #   2. Cloudflare Origin cert present on the server at /opt/otuburu/origin/{cert,key}.pem
  # Without (2), Caddy starts but fails to load TLS and restart-loops (trading
  # services are unaffected). See VOTE repo CLOUDFLARE-INGRESS.md.
  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - gateway
      - wallet
      - staking
    ports:
      - "2087:2087"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/otuburu/frontend:/srv:ro
      - /opt/otuburu/origin:/etc/caddy/origin:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  stakingdata:
  enginedata:
  caddy_data:
  caddy_config:
