services:

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-otuburu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-otuburu}
      POSTGRES_DB:       ${POSTGRES_DB:-otuburu}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    expose:
      - "5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otuburu"]
      interval: 10s
      timeout: 5s
      retries: 5

  engine:
    image: ghcr.io/filatei/otuburu-engine:staging
    restart: always
    environment:
      ENGINE_GRPC_ADDR: "0.0.0.0:9090"
      RUST_LOG: "otuburu_engine=info,warn"
    expose:
      - "9090"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat /dev/null > /dev/tcp/localhost/9090' && echo ok || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  gateway:
    image: ghcr.io/filatei/otuburu-gateway:staging
    restart: always
    environment:
      PORT:        "8082"
      ENGINE_ADDR: "engine:9090"
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      - internal
    depends_on:
      - engine
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  wallet:
    image: ghcr.io/filatei/otuburu-wallet:staging
    restart: always
    environment:
      PORT:              "8083"
      POSTGRES_HOST:     "postgres"
      POSTGRES_USER:     ${POSTGRES_USER:-otuburu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-otuburu}
      POSTGRES_DB:       ${POSTGRES_DB:-otuburu}
      JWT_SECRET:        ${JWT_SECRET:-change-me-in-production}
      WALLET_MNEMONIC:   ${WALLET_MNEMONIC:-}
      TRONGRID_API_KEY:  ${TRONGRID_API_KEY:-}
      GOOGLE_CLIENT_ID:  ${GOOGLE_CLIENT_ID:-}
      ADMIN_SECRET:      ${ADMIN_SECRET:-}
    ports:
      - "127.0.0.1:8083:8083"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  staking:
    image: ghcr.io/filatei/otuburu-staking:staging
    restart: always
    environment:
      PORT:                "8084"
      NODE_ENV:            "production"
      BASE_URL:            "https://otuburu.torama.money"
      JWT_SECRET:          ${JWT_SECRET:-change-me-in-production-use-32-chars-min}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      USD_TO_NGN_RATE:     ${USD_TO_NGN_RATE:-1600}
      SMTP_HOST:           ${SMTP_HOST:-smtp-relay.gmail.com}
      SMTP_PORT:           ${SMTP_PORT:-587}
      SMTP_SECURE:         ${SMTP_SECURE:-false}
      SMTP_USER:           ${SMTP_USER:-}
      SMTP_PASS:           ${SMTP_PASS:-}
      SMTP_FROM:           ${SMTP_FROM:-Otuburu <noreply@torama.money>}
      ADMIN_EMAIL:         ${ADMIN_EMAIL:-filatei@gtsng.com}
      ADMIN_EMAILS:        ${ADMIN_EMAILS:-filatei@gtsng.com}
      STAKING_DB_PATH:     "/data/staking.db"
    ports:
      - "127.0.0.1:8084:8084"
    volumes:
      - stakingdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  stakingdata:
