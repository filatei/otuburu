apiVersion: apps/v1
kind: Deployment
metadata:
  name: otuburu-gateway
  namespace: otuburu-staging
  labels:
    app: otuburu-gateway
    environment: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: otuburu-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: otuburu-gateway
        version: "${GATEWAY_SHA}"
    spec:
      containers:
        - name: gateway
          image: ${GATEWAY_IMAGE}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          env:
            - name: PORT
              value: "8082"
            - name: ENGINE_ADDR
              value: "otuburu-engine:9090"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: otuburu-gateway
  namespace: otuburu-staging
  labels:
    app: otuburu-gateway
  annotations:
    # Linode NodeBalancer — provisions an external IP automatically
    service.beta.kubernetes.io/linode-loadbalancer-throttle: "4"
spec:
  selector:
    app: otuburu-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8082
      protocol: TCP
    - name: ws
      port: 443
      targetPort: 8082
      protocol: TCP
  type: LoadBalancer
