apiVersion: apps/v1
kind: Deployment
metadata:
  name: otuburu-engine
  namespace: otuburu-staging
  labels:
    app: otuburu-engine
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otuburu-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: otuburu-engine
        version: "${ENGINE_SHA}"
    spec:
      containers:
        - name: engine
          image: ${ENGINE_IMAGE}
          imagePullPolicy: Always
          ports:
            - name: grpc
              containerPort: 9090
              protocol: TCP
          env:
            - name: ENGINE_GRPC_ADDR
              value: "0.0.0.0:9090"
            - name: RUST_LOG
              value: "otuburu_engine=info,warn"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: otuburu-engine
  namespace: otuburu-staging
  labels:
    app: otuburu-engine
spec:
  selector:
    app: otuburu-engine
  ports:
    - name: grpc
      port: 9090
      targetPort: 9090
      protocol: TCP
  type: ClusterIP
