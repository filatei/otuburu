# Apache vhost for otuburu.torama.money — proxies to the Node engine
# running as the `otuburu` system user on 127.0.0.1:8080.
#
# This file is the canonical version. The copy on the Linode at
# /etc/apache2/sites-available/otuburu.torama.money.conf is kept in sync
# by scripts/deploy.sh.
#
# Certbot will manage the <VirtualHost *:443> block automatically when
# it is first run (see TLS_SETUP.md). After certbot has run, this file
# will contain both *:80 and *:443 blocks — only the *:80 block is below
# because that's all we need to ship until then.

<VirtualHost *:80>
    ServerName otuburu.torama.money

    ProxyPreserveHost On
    ProxyRequests Off

    # WebSocket upgrade (must come before the generic / rule)
    ProxyPass        /ws  ws://127.0.0.1:8080/ws
    ProxyPassReverse /ws  ws://127.0.0.1:8080/ws

    # Everything else
    ProxyPass        /    http://127.0.0.1:8080/
    ProxyPassReverse /    http://127.0.0.1:8080/

    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog  ${APACHE_LOG_DIR}/otuburu_error.log
    CustomLog ${APACHE_LOG_DIR}/otuburu_access.log combined
</VirtualHost>
