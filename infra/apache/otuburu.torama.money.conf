# /etc/apache2/sites-available/otuburu.conf
# Managed by deploy pipeline — do not edit manually on server.

# ── HTTP: redirect all to HTTPS ───────────────────────────────────────────────
<VirtualHost *:80>
    ServerName otuburu.torama.money
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# ── HTTPS ─────────────────────────────────────────────────────────────────────
<VirtualHost *:443>
    ServerName otuburu.torama.money

    # ── Real visitor IP behind Cloudflare (a2enmod remoteip) ──────────────────
    # Restore the client IP from CF-Connecting-IP, trusting only Cloudflare's
    # published ranges. Refresh from https://www.cloudflare.com/ips/ if changed.
    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxy 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
    RemoteIPTrustedProxy 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32

    SSLEngine on
    # Cloudflare Origin CA cert (recommended; this host is/will be PROXIED). One
    # *.torama.money origin cert covers all subdomains and never needs renewal.
    # Switch to these two lines only after the cert+key are on the server and
    # `apache2ctl configtest` passes. See VOTE repo CLOUDFLARE.md.
    #SSLCertificateFile    /etc/ssl/cloudflare/torama.money.pem
    #SSLCertificateKeyFile /etc/ssl/cloudflare/torama.money.key
    # Current: Let's Encrypt. Renewal breaks once proxied — switch to Origin CA.
    SSLCertificateFile    /etc/letsencrypt/live/otuburu.torama.money/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/otuburu.torama.money/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # ── Static frontend ───────────────────────────────────────────────────────
    DocumentRoot /opt/otuburu/frontend

    <Directory /opt/otuburu/frontend>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    # ── WebSocket proxy (trading engine) ─────────────────────────────────────
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteRule ^/ws$  ws://127.0.0.1:8082/ws  [P,L]

    ProxyPass        /ws  ws://127.0.0.1:8082/ws
    ProxyPassReverse /ws  ws://127.0.0.1:8082/ws

    # ── Staking service (algo staking + Paystack → port 8084) ────────────────
    # MUST appear before the generic /api/ block — Apache matches longest prefix first.
    ProxyPreserveHost On
    ProxyPass        /api/stake/  http://127.0.0.1:8084/api/stake/
    ProxyPassReverse /api/stake/  http://127.0.0.1:8084/api/stake/
    ProxyPass        /staking     http://127.0.0.1:8084/staking
    ProxyPassReverse /staking     http://127.0.0.1:8084/staking

    # ── REST API proxy (gateway → port 8082) ─────────────────────────────────
    ProxyPass        /api/     http://127.0.0.1:8082/api/
    ProxyPassReverse /api/     http://127.0.0.1:8082/api/
    ProxyPass        /healthz  http://127.0.0.1:8082/healthz
    ProxyPassReverse /healthz  http://127.0.0.1:8082/healthz

    # ── Wallet service (auth + deposits + admin → port 8083) ──────────────────
    ProxyPass        /auth/      http://127.0.0.1:8083/auth/
    ProxyPassReverse /auth/      http://127.0.0.1:8083/auth/
    ProxyPass        /wallet/    http://127.0.0.1:8083/wallet/
    ProxyPassReverse /wallet/    http://127.0.0.1:8083/wallet/
    ProxyPass        /admin      http://127.0.0.1:8083/admin
    ProxyPassReverse /admin      http://127.0.0.1:8083/admin
    # /payments/* — Paystack init/callback + public rate map. Same service.
    # Was missing from this vhost which is why POST /payments/paystack/initiate
    # was falling through to the static frontend and returning <!DOCTYPE html>
    # for clients to choke on. The wallet service registers all three:
    #   POST /payments/paystack/initiate   (deposit kickoff, auth required)
    #   GET  /payments/paystack/callback   (Paystack redirect target)
    #   GET  /payments/rates               (public NGN/GHS/KES/ZAR/UGX map)
    ProxyPass        /payments/  http://127.0.0.1:8083/payments/
    ProxyPassReverse /payments/  http://127.0.0.1:8083/payments/

    # ── Security headers ──────────────────────────────────────────────────────
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    <FilesMatch "\.(js|css|ico|png|woff2?)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/otuburu-error.log
    CustomLog ${APACHE_LOG_DIR}/otuburu-access.log combined
</VirtualHost>
